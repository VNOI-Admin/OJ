name: deploy

# Triggers only when code is merged into the `deploy` branch (per design:
# `deploy` is a dedicated branch, separate from `master`, that always
# reflects exactly what should be running in production -- merging into it
# is the deliberate "ship this" action).
on:
  push:
    branches: [deploy]

concurrency:
  group: deploy-production
  cancel-in-progress: false   # never cancel a deploy mid-flight

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # -> ghcr.io/hiulaptop/thinkcode-oj

jobs:
  # Re-run the same checks as build.yml before deploying. Belt-and-suspenders:
  # even though branch protection on `deploy` should already require build.yml
  # to pass before a merge is allowed, this guarantees a broken commit can
  # never reach the deploy step even if branch protection is misconfigured.
  test:
    uses: ./.github/workflows/build.yml

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image tag
        id: meta
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${GITHUB_SHA::7}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production   # requires manual approval if configured under repo Settings > Environments
    steps:
      - name: Set up deploy SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy via restricted SSH command
        run: |
          # The deploy key is locked down server-side to only ever run
          # ssh-deploy-wrapper.sh regardless of what command we ask for here
          # (see deploy/ssh-deploy-wrapper.sh) -- so this "command" is really
          # just the argument string that script parses, not an arbitrary
          # remote shell command. The GHCR token is piped over stdin, never
          # passed as an argument (avoids leaking it via `ps aux` on the
          # server for the session's duration).
          echo "${{ secrets.GITHUB_TOKEN }}" | ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "deploy ${{ needs.build-and-push.outputs.image }}"
        # deploy.sh (invoked by the wrapper) exits non-zero on failure (even
        # after a successful auto-rollback -- see deploy/deploy.sh comments),
        # which correctly fails this job and notifies via GitHub's normal
        # workflow-failure notifications.

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
